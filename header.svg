<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Text & Glow Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .dot {
      fill: #22C55E;
    }
  </style>

  <!-- Background Card -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Border -->
  <rect width="848" height="238" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="50" r="100" fill="#0284C7" opacity="0.15" filter="url(#glow)" />
  <circle cx="700" cy="80" r="120" fill="#8B5CF6" opacity="0.15" filter="url(#glow)" />

  <!-- Wavy Background Decor (Layer 1) -->
  <path d="M 0,195 C 180,165 320,225 500,185 C 650,150 750,210 850,185 L 850,240 L 0,240 Z" fill="url(#waveGrad1)" />

  <!-- Wavy Foreground (Layer 2) -->
  <path d="M 0,215 C 200,185 360,235 520,205 C 680,175 760,225 850,210 L 850,240 L 0,240 Z" fill="url(#waveGrad2)" opacity="0.5" />

  <!-- Content Group -->
  <g transform="translate(425, 0)">
    <!-- Status Badge -->
    <g transform="translate(-115, 30)">
      <rect width="230" height="28" rx="14" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="14" r="4.5" class="dot" />
      <text x="32" y="18.5" class="badge-text">OPEN FOR PROJECTS &amp; WORK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" text-anchor="middle" class="title" fill="url(#textGrad)">
      Hi, I'm Mahardika Rafa 👋
    </text>

    <!-- Subtitle (Web & Mobile Developer) -->
    <text x="0" y="138" text-anchor="middle" class="subtitle">
      WEB &amp; MOBILE DEVELOPER
    </text>

    <!-- Tech Pills (Web first, then Mobile) -->
    <g transform="translate(-195, 155)">
      <!-- Pill 1: Web -->
      <rect x="0" y="0" width="125" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="62.5" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Laravel &amp; PHP</text>

      <!-- Pill 2: Mobile -->
      <rect x="135" y="0" width="120" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#818CF8" stroke-opacity="0.3" />
      <text x="195" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#818CF8">Flutter &amp; Dart</text>

      <!-- Pill 3: Design -->
      <rect x="265" y="0" width="125" height="24" rx="12" fill="#1E293B" opacity="0.7" stroke="#C084FC" stroke-opacity="0.3" />
      <text x="327.5" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#C084FC">UI/UX &amp; Figma</text>
    </g>
  </g>
</svg>
